[package]
name = "nodaw-mfcc-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Thin wasm-bindgen wrapper around wavey-ai/mfcc-rust (speechsauce) for browser timbre profiles"

[lib]
crate-type = ["cdylib"]

[dependencies]
speechsauce = { path = "../mfcc-rust/speechsauce" }
ndarray = "0.15"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
